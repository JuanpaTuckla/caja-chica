<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>Caja Chica de Obra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A2632">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 520px), tarjeta de saldo arriba, lista de movimientos, barra inferior con botón + central. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202B; --muted:#5D6A77; --line:#DAE0E6;
  --accent:#EE6420; --accent-ink:#FFFFFF; --accent-soft:#FDE8DC;
  --card:#1A2632; --card-ink:#F3F6F8; --card-muted:#A9B6C2;
  --good:#18915A; --bad:#C93A3A; --warn:#B7791F; --warn-soft:#FBF0DB;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(21,32,43,.06), 0 4px 16px rgba(21,32,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --surface-2:#1D2732; --ink:#E7ECF1; --muted:#93A1AF; --line:#283440;
  --accent:#FF7834; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --card:#22303E; --card-ink:#F3F6F8; --card-muted:#A3B1BE;
  --good:#3CC283; --bad:#F06A6A; --warn:#E3A84A; --warn-soft:#3A2E17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --surface-2:#1D2732; --ink:#E7ECF1; --muted:#93A1AF; --line:#283440;
  --accent:#FF7834; --accent-ink:#1A0E07; --accent-soft:#3A2418;
  --card:#22303E; --card-ink:#F3F6F8; --card-muted:#A3B1BE;
  --good:#3CC283; --bad:#F06A6A; --warn:#E3A84A; --warn-soft:#3A2E17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.obra-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 10px;font-weight:600;max-width:65%;min-width:0}
.obra-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.offline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:12px}

/* balance */
.balance{background:var(--card);color:var(--card-ink);border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.balance.tela{background:radial-gradient(120% 140% at 0% 0%,#E0262F 0%,#B3121C 45%,#1B3A8C 100%);color:#fff}
.balance.tela::after{inset:0;width:auto;height:auto;border-radius:0;opacity:.32;background:var(--web) right -90px top -70px/320px 320px no-repeat}
.balance.tela .lbl,.balance.tela small,.balance.img .lbl,.balance.img small{color:rgba(255,255,255,.85)}
.balance.tela .bar,.balance.img .bar{background:rgba(255,255,255,.25)}.balance.tela .bar i{background:#fff}
.balance.img{background:linear-gradient(180deg,rgba(10,14,20,.25),rgba(10,14,20,.7)),var(--bgimg) center/cover;color:#fff}
.balance.img::after{display:none}
.balance .big,.balance.img .big{text-shadow:0 2px 10px rgba(0,0,0,.25)}
.balance-edit{position:absolute;right:12px;bottom:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
.balance-edit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.balance>*{position:relative;z-index:1}
.bg-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg-opt{border:2px solid var(--line);border-radius:16px;padding:0;overflow:hidden;background:var(--surface);text-align:left}
.bg-opt.on{border-color:var(--accent)}
.bg-opt .pv{height:84px;padding:10px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:flex-end;position:relative;overflow:hidden}
.bg-opt span{display:block;padding:8px 10px;font-weight:600;font-size:13.5px}
.balance::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  background:repeating-linear-gradient(135deg,var(--accent) 0 10px,transparent 10px 20px);opacity:.16}
.balance .lbl{font-size:13px;color:var(--card-muted);letter-spacing:.02em}
.balance .big{font-family:var(--f-display);font-weight:700;font-stretch:108%;font-size:clamp(34px,10vw,44px);line-height:1.05;margin:4px 0 14px;letter-spacing:-.01em}
.balance .big.neg{color:#FF8E8E}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bal-row div{min-width:0}
.bal-row b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px}
.bal-row small{color:var(--card-muted);font-size:12px}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin:14px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 16px;font-weight:700;min-height:50px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn-danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn-block{width:100%}
.btn svg{width:20px;height:20px}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px;gap:8px}
.section-h h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;font-stretch:104%}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px}

.cats-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats-scroll::-webkit-scrollbar{display:none}
.cat-chip{flex:none;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:128px;text-align:left}
.cat-chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cat-chip b{font-family:var(--f-display);font-size:16px}
.cat-chip small{color:var(--muted);font-size:12px}

.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.ico .emo{font-size:20px;line-height:1}
.ico-lg{width:64px;height:64px;border-radius:18px}.ico-lg .emo{font-size:32px}.ico-lg svg{width:30px;height:30px}.ico-lg img{border-radius:18px}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:20px;padding:0;display:grid;place-items:center}
.emo-grid button.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.inp.auto,.money.auto{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.autolbl{font-size:11.5px;font-weight:600;color:var(--good)}
.ocr{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.ocr.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.ocr .pbar{flex:1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}.ocr .pbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.pay small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
.pay .ico{width:44px;height:44px}
.tag.person{color:var(--ink);background:var(--surface-2)}
.actions.three{grid-template-columns:1.3fr 56px 1fr}
.btn-mic{background:var(--surface);border:1px solid var(--line);padding:0;color:var(--bad)}
.btn-mic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.mic-big{width:104px;height:104px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;margin:18px auto 10px}
.mic-big svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:2}
.mic-big.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion: reduce){.mic-big.on{animation:none}}
.timer{text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700}
.voz-txt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px;color:var(--ink)}
.voz-txt i{color:var(--muted)}
textarea.inp{min-height:84px;resize:vertical;font:inherit}
.draft{display:grid;grid-template-columns:1fr 100px;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px}
.draft select{grid-column:1/-1}
audio{width:100%;height:40px}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:150px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;width:88%}
.msg.bot .list{margin-top:10px}
.msg.bot b.big{font-family:var(--f-display);font-size:22px;display:block;margin:2px 0}
.msg .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.msg .thumbs button{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--surface-2)}
.msg .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.msg .brk{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;margin-top:10px;font-size:14px}
.ask{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.ask-in{max-width:488px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ask .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.ask .chips::-webkit-scrollbar{display:none}
.ask .chip{flex:none}
.ask form{display:flex;gap:8px}
.ask form .inp{border-radius:999px;padding:12px 16px}
.ask form button{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.ask form button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{border:0;background:transparent;flex:1;padding:11px 0;min-width:0;outline:none}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

.day{margin-top:14px}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:0 4px 6px}
.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;width:100%;background:none;border:0;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;flex:none}
.row .amt b{display:block;font-family:var(--f-display);font-weight:600;font-size:15.5px}
.row .amt b.in{color:var(--good)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.tag.warn{color:var(--warn);background:var(--warn-soft)}
.tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.empty{text-align:center;color:var(--muted);padding:28px 12px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button.on{color:var(--ink)}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);padding:0}
.nav .fab svg{width:28px;height:28px;stroke-width:2.4}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:100%;overflow:auto;border-radius:22px 22px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet.full{height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet.still{animation:none}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h3{flex:1;margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* wizard */
.steps{display:flex;gap:5px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.wz-body{flex:1}
.q{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;margin:4px 0 6px;font-stretch:104%;text-wrap:balance}
.hint{color:var(--muted);margin:0 0 18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:12.5px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.money{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px}
.money span{font-family:var(--f-display);font-size:34px;color:var(--muted);font-weight:600}
.money input{border:0;background:transparent;outline:none;font-family:var(--f-display);font-weight:700;font-size:40px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;text-align:center}
.cat-opt.on{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c) inset;background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.photo-box{border:2px dashed var(--line);border-radius:18px;background:var(--surface);min-height:220px;display:grid;place-items:center;overflow:hidden;position:relative}
.photo-box img{width:100%;max-height:52vh;object-fit:contain;display:block;background:#000}
.photo-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:24px;text-align:center}
.photo-ph svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pay-opts{display:grid;gap:10px}
.pay{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600;font-size:16px}
.pay.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.pay svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wz-foot{display:flex;gap:10px;padding-top:14px;position:sticky;bottom:0;background:var(--bg)}
.wz-foot .btn{flex:1}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rv{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv span{color:var(--muted);font-size:13px;flex:none}
.rv b{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rv .edit{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0 0 0 6px}
.thumb{width:100%;max-height:220px;object-fit:cover;display:block}

/* summary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-family:var(--f-display);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.crow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.crow .nm small{color:var(--muted);font-weight:500}
.hbar{height:8px;border-radius:8px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:8px;background:var(--c)}
.crow .v{font-family:var(--f-display);font-weight:600;text-align:right}
.crow .v small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:12px}
.stack{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 12px}
.stack i{display:block;height:100%}

.obra-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left;margin-bottom:10px}
.obra-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.obra-card .mid{flex:1;min-width:0}
.obra-card .t{font-weight:700;font-size:16px}
.obra-card .s{color:var(--muted);font-size:13px}
.obra-card .v{font-family:var(--f-display);font-weight:700;text-align:right}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:14px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.mi:first-child{border-top:0}
.mi .mid{flex:1;min-width:0}
.mi .t{font-weight:600}
.mi .s{color:var(--muted);font-size:12.5px}
.mi > svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.note{font-size:13px;color:var(--muted);margin:10px 4px}

.welcome{padding-top:8vh}
.welcome h1{font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:clamp(30px,9vw,40px);line-height:1.02;margin:0 0 10px;text-wrap:balance}
.welcome p{color:var(--muted);max-width:40ch}
.stripe{height:10px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--accent) 0 12px,var(--ink) 12px 24px);margin-bottom:22px;width:120px}

.viewer{position:fixed;inset:0;z-index:60;background:#000;overflow:auto;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer.zoom{display:block}
.viewer.zoom img{max-width:none;max-height:none;width:220%}
.viewer .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:rgba(255,255,255,.15);border:0;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>

function fmtDay(s){ if(s===todayISO()) return 'Hoy'; if(s===todayISO(-1)) return 'Ayer'; const d=parseISO(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; }
function fmtDate(s){ const d=parseISO(s); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function parseMonto(s){
  s=String(s||'').replace(/[^\d.,]/g,''); if(!s) return 0;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>-1 && ld>-1){ const dec = lc>ld?',':'.'; s = s.split(dec==='.'?',':'.').join(''); s=s.replace(',', '.'); }
  else if(lc>-1){ s = (s.split(',').length>2)? s.split(',').join('') : s.replace(',','.'); }
  else if(s.split('.').length>2){ s=s.split('.').join(''); }
  const v=parseFloat(s); return isFinite(v)?r2(v):0;
}
function fmtFactura(s){ const d=String(s).replace(/\D/g,''); if(String(s).replace(/[\d\-\s]/g,'')!=='' ) return s; if(d.length<=3) return d; if(d.length<=6) return d.slice(0,3)+'-'+d.slice(3); return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6,15); }
let toastT; function toast(msg){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const store = { get(k,d){try{const v=localStorage.getItem('cc_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem('cc_'+k,JSON.stringify(v));}catch(e){}} };

/* ---------- base de datos (IndexedDB, con respaldo en memoria) ---------- */
const DB = {
  db:null, mem:{obras:new Map(),movs:new Map(),fotos:new Map(),cats:new Map()},
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{ const r=indexedDB.open('cajachica',2);
        r.onupgradeneeded=()=>{const d=r.result; for(const n of ['obras','movs','fotos','cats']) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id'});};
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); setTimeout(()=>rej(new Error('timeout')),4000); });
    }catch(e){ this.db=null; }
  },
  _req(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const os=t.objectStore(store); const r=fn(os); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  async all(s){ if(!this.db) return [...this.mem[s].values()]; return this._req(s,'readonly',os=>os.getAll()); },
  async get(s,id){ if(!this.db) return this.mem[s].get(id); return this._req(s,'readonly',os=>os.get(id)); },
  async put(s,o){ if(!this.db){this.mem[s].set(o.id,o);return;} return this._req(s,'readwrite',os=>os.put(o)); },
  async putMany(s,arr){ if(!this.db){arr.forEach(o=>this.mem[s].set(o.id,o));return;} return this._req(s,'readwrite',os=>{arr.forEach(o=>os.put(o));}); },
  async del(s,id){ if(!this.db){this.mem[s].delete(id);return;} return this._req(s,'readwrite',os=>os.delete(id)); }
};

const obra = () => S.obras.find(o=>o.id===S.obraId);
const movsObra = (id=S.obraId) => S.movs.filter(m=>m.obraId===id);
function totales(list){ let ing=0,gas=0; for(const m of list){ if(m.tipo==='ingreso') ing+=m.valor; else gas+=m.valor; } return {ing:r2(ing),gas:r2(gas),saldo:r2(ing-gas)}; }
const sortMovs = a => a.slice().sort((x,y)=> y.fecha.localeCompare(x.fecha) || (y.creado||0)-(x.creado||0));

async function loadCats(){ let cs=await DB.all('cats'); if(!cs.length){ cs=DEFAULT_CATS.map((c,i)=>({...c,orden:i})); await DB.putMany('cats',cs); } CATS=cs.sort((a,b)=>(a.orden??99)-(b.orden??99)); CAT=Object.fromEntries(CATS.map(c=>[c.id,c])); }
async function loadAll(){ await loadCats(); S.obras=(await DB.all('obras')).sort((a,b)=>(a.creada||0)-(b.creada||0)); S.movs=await DB.all('movs'); if(!S.obras.find(o=>o.id===S.obraId)) S.obraId = S.obras[0]?.id||null; }
async function askPersist(){ try{ if(navigator.storage?.persist && !S.persisted){ S.persisted = await navigator.storage.persisted() || await navigator.storage.persist(); } }catch(e){} }

function filtrar(list){
  const q=S.q.trim().toLowerCase(), qd=q.replace(/[\s\-]/g,''), isNum=/^\d{3,}$/.test(qd);
  return list.filter(m=> (!S.cat || m.categoria===S.cat) && (!q || (isNum ? [m.numero,m.factura].some(x=>String(x||'').replace(/\D/g,'').includes(qd))
    : [m.detalle,m.beneficiario,m.lugar,m.factura,m.numero,m.pago].join(' ').toLowerCase().includes(q))));
}

function listaHTML(grupos){

  <div class="list">${g.items.map(rowHTML).join('')}</div></div>`).join('');
}
function rowHTML(m){
  const ing=m.tipo==='ingreso';

  const qd=S.q.replace(/\D/g,''); if(m.numero && qd.length>=3 && String(m.numero).replace(/\D/g,'').includes(qd)) sub=`${m.pago==='CHEQUE'?'Cheque':'Transf.'} n.º ${m.numero} · `+sub;
  return `<button class="row" data-act="ver" data-id="${m.id}">
    ${ing?`<span class="ico" style="--c:var(--good)">${svg(IC.INGRESO)}</span>`:catIcon(m.categoria)}
    <div class="mid"><div class="t">${esc(m.detalle||'Sin detalle')}</div><div class="s">${esc(sub)}</div></div>
    <div class="amt"><b class="num ${ing?'in':''}">${m.pendiente&&!m.valor?'$ ?':(ing?'+':'−')+money(m.valor)}</b>

}
const cap = s => s? s.charAt(0)+s.slice(1).toLowerCase() : '';

/* ---------- resumen ---------- */
function enPeriodo(m){
  if(S.periodo==='todo') return true;
  const d=new Date(); let y=d.getFullYear(), mo=d.getMonth();
  if(S.periodo==='pasado'){ mo--; if(mo<0){mo=11;y--;} }
  if(S.periodo.startsWith('m:')){ [y,mo]=S.periodo.slice(2).split('-').map(Number); mo--; }
  const p=parseISO(m.fecha); return p.getFullYear()===y && p.getMonth()===mo;
}

    ${meses.slice(0,4).map(k=>{const [y,mo]=k.split('-');return `<button class="chip ${S.periodo==='m:'+k?'on':''}" data-act="periodo" data-p="m:${k}">${MESES_L[mo-1]} ${y}</button>`;}).join('')}

  <div class="kpis num"><div class="kpi"><small>Gastado</small><b>${money(t.gas)}</b></div><div class="kpi"><small>Fondos</small><b>${money(t.ing)}</b></div><div class="kpi"><small>Gastos</small><b>${gastos.length}</b></div></div>
  <div class="section-h"><h2>Por categoría</h2></div>
  <div class="card">${cats.length?`<div class="stack">${cats.map(([id,v])=>`<i style="width:${v/t.gas*100}%;background:${CAT[id]?.c||'#888'}" title="${esc(CAT[id]?.n||id)}"></i>`).join('')}</div>

    :`<div class="empty">No hay gastos en este periodo.</div>`}</div>
  ${gastos.length?`<div class="section-h"><h2>Por forma de pago</h2></div>
  <div class="card">${PAGOS.filter(p=>porPago[p.id]).map(p=>`<div class="crow" style="--c:var(--ink)"><span class="ico" style="--c:var(--muted)">${svg(p.i)}</span><div class="nm">${p.n}</div><div class="v num">${money(porPago[p.id])}<small>${(porPago[p.id]/t.gas*100).toFixed(1)}%</small></div></div>`).join('')}</div>

  <div class="menu">${persL.map(([n,x])=>`<button class="mi" data-act="persona-list" data-n="${esc(n)}"><span class="ico" style="--c:var(--ink)">${svg(UI.person)}</span><div class="mid"><div class="t">${esc(n)}</div><div class="s">${x.n} ${x.n===1?'pago':'pagos'}</div></div><b class="num" style="font-family:var(--f-display)">${money(x.v)}</b></button>`).join('')}</div>`:''}

}

const au=k=>W&&W.auto&&W.auto.has(k)?'auto':'';
function wzValid(){ const st=steps()[W.step], d=W.d;
  if(st==='persona'){ if(!d.beneficiario.trim()) return 'Escribe el nombre de la persona.'; if(!d.detalle.trim()||d.detalle==='OTRO') return 'Escribe para qué fue el dinero.'; }
  if(st==='valor'){ if(!(parseMonto(d.valor)>0)) return 'Escribe el valor que pagaste.'; if(!d.categoria) return 'Elige una categoría.'; }
  if(st==='detalle' && !d.detalle.trim()) return 'Escribe qué compraste.';
  if(st==='factura' && !d.fecha) return 'Elige la fecha.';
  return ''; }
async function wzSave(){
  const STEPS=steps(); for(let i=0;i<STEPS.length;i++){ W.step=i; const e=wzValid(); if(e){ renderWz(); $('#w-err').textContent=e; return; } }
  W.step=STEPS.length-1; const per=W.mode==='persona';
  const d=W.d, prev=W.isNew?null:S.movs.find(m=>m.id===W.id);
  const m={ id:W.id||uid(), obraId:prev?.obraId||S.obraId, tipo:'gasto', fecha:d.fecha, detalle:d.detalle.trim().toUpperCase(), beneficiario:d.beneficiario.trim().toUpperCase(), lugar:per?'':d.lugar.trim().toUpperCase(),
    factura:per?'':d.factura.trim(), persona:per, pago:d.pago, numero:d.pago==='EFECTIVO'?'':d.numero.trim(), valor:parseMonto(d.valor), categoria:d.categoria, fotoId:prev?.fotoId||null, compId:prev?.compId||null, audioId:prev?.audioId||null, voz:prev?.voz||'', pendiente:false, ocrTexto:W.ocr?.texto??prev?.ocrTexto??'', ocrComp:W.ocrC?.texto??prev?.ocrComp??'', creado:prev?.creado||Date.now(), editado:Date.now() };
  if(d.pago==='EFECTIVO' && W.comp){ W.comp=null; W.compChanged=true; }
  if(W.compChanged){ if(m.compId) await DB.del('fotos',m.compId); m.compId=null; if(W.comp){ m.compId=uid(); await DB.put('fotos',{id:m.compId,blob:W.comp}); } }
  if(W.fotoChanged){ if(m.fotoId) await DB.del('fotos',m.fotoId); m.fotoId=null; if(W.foto){ m.fotoId=uid(); await DB.put('fotos',{id:m.fotoId,blob:W.foto}); } }
  await DB.put('movs',m); if(W.fotoUrl) URL.revokeObjectURL(W.fotoUrl);
  await loadAll(); closeLayer(); S.view='inicio'; render(); toast(prev?.pendiente?'Gasto completado':W===null&&prev?'Gasto actualizado':'Gasto guardado'); askPersist();
}

function parseComprobante(txt,pago){

/* ---------- Claude (con internet) ---------- */
const getKey=()=>store.get('claudeKey','');
const CLAUDE_SYS=`Eres Claude, el asistente de la app "Caja Chica de Obra" de un residente de obra en Ecuador. Respondes en español, claro y breve, como un colega que lleva las cuentas. Los montos son en dólares (USD) y se escriben como $1.234,56.
Usa la herramienta obtener_movimientos para leer los datos actuales antes de responder sobre gastos, saldos o sumas; no inventes cifras. Usa ver_fotos cuando la pregunta trate de lo que dice o muestra una factura, un comprobante de transferencia o un cheque, o cuando quieras confirmar un dato en la foto; pide solo las fotos que necesites (máximo 6).
Cuando menciones un movimiento concreto, añade su id entre corchetes dobles, por ejemplo [[abc123]], para que la app muestre un enlace al gasto. Si algo no está en los datos, dilo. No uses tablas; usa listas cortas y negritas con **texto** cuando ayude.`;
const CLAUDE_TOOLS=[
  {name:'obtener_movimientos',description:'Devuelve las obras, el saldo de cada una y todos los movimientos (gastos e ingresos) de la obra pedida, con fecha, detalle, beneficiario, lugar, factura, forma de pago, número de transferencia o cheque, valor, categoría, si es pago a persona, si tiene foto de factura o de comprobante, y el texto leído de esas fotos.',
   strict:true,input_schema:{type:'object',properties:{obra:{type:'string',description:'Nombre de la obra. Vacío para la obra abierta en la app.'}},required:['obra'],additionalProperties:false}},
  {name:'ver_fotos',description:'Devuelve las fotos (factura y/o comprobante) de los movimientos indicados por id, para que puedas leerlas.',
   strict:true,input_schema:{type:'object',properties:{ids:{type:'array',items:{type:'string'},description:'Ids de movimientos, máximo 6.'}},required:['ids'],additionalProperties:false}}
];
function datosObra(nombre){
  const o = (nombre&&S.obras.find(x=>nrm(x.nombre)===nrm(nombre))) || obra();
  const ms=sortMovs(movsObra(o.id)).reverse();
  return JSON.stringify({hoy:todayISO(),obra_consultada:o.nombre,
    obras:S.obras.map(x=>({nombre:x.nombre,...totales(movsObra(x.id))})),
    categorias:visibleCats().map(c=>({codigo:c.id,nombre:c.n})),
    movimientos:ms.map(m=>({id:m.id,fecha:m.fecha,tipo:m.tipo,detalle:m.detalle,beneficiario:m.beneficiario||'',lugar:m.lugar||'',factura:m.factura||'',pago:m.pago,numero:m.numero||'',valor:m.valor,categoria:CAT[m.categoria]?.n||m.categoria||'',pago_a_persona:!!m.persona,foto_factura:!!m.fotoId,foto_comprobante:!!m.compId,
      texto_foto:(m.ocrTexto||'').slice(0,600),texto_comprobante:(m.ocrComp||'').slice(0,300)}))});
}
async function fotosPara(ids){
  const out=[]; let n=0;
  for(const id of (ids||[]).slice(0,6)){ const m=S.movs.find(x=>x.id===id); if(!m){ out.push({type:'text',text:`No existe el movimiento ${id}.`}); continue; }
    for(const [fid,et] of [[m.fotoId,'factura'],[m.compId,m.pago==='CHEQUE'?'cheque':'comprobante']]){ if(!fid||n>=8) continue; const f=await DB.get('fotos',fid); if(!f) continue;
      const sm=await compress(f.blob,1400,.8); const b64=(await blobToDataURL(sm.blob)).split(',')[1]; n++;
      out.push({type:'text',text:`Foto de ${et} del movimiento ${id} (${m.fecha}, ${m.detalle}, ${money(m.valor)}):`}); out.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}}); }
    if(!m.fotoId&&!m.compId) out.push({type:'text',text:`El movimiento ${id} no tiene fotos.`}); }
  return out.length?out:[{type:'text',text:'No hay fotos para esos movimientos.'}];
}
async function llamarClaude(messages){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2026-10-21','anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',system:CLAUDE_SYS,tools:CLAUDE_TOOLS,tool_choice:{type:'auto'},messages})});
  if(!res.ok){ let msg=''; try{ msg=(await res.json()).error?.message||''; }catch(e){} const err=new Error(msg||('HTTP '+res.status)); err.status=res.status; throw err; }
  return res.json();
}
function textoClaude(t){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/\[\[([a-z0-9]+)\]\]/gi,(x,id)=>S.movs.find(m=>m.id===id)?` <button class="link" style="padding:0 2px;font-size:13px" data-act="ver" data-id="${id}">ver</button>`:'');
  return h.split(/\n{2,}/).map(p=>`<p style="margin:0 0 8px">${p.replace(/\n/g,'<br>')}</p>`).join('');
}
async function preguntarClaude(texto){
  if(!getKey()){ abrirClave(); return; }
  if(!navigator.onLine){ S.chatC.push({me:texto}); S.chatC.push({bot:'No tienes internet ahora. Cambia a <b>Jarvis</b>, que funciona sin señal, o vuelve a preguntarme cuando tengas conexión.'}); render(); return; }
  S.chatC.push({me:texto}); S.pensando=true; render(); scrollTo(0,document.body.scrollHeight);
  const nuevos=[{role:'user',content:`(Hoy es ${todayISO()}. Obra abierta en la app: ${obra().nombre}.)\n${texto}`}];
  try{
    let msgs=S.claudeMsgs.concat(nuevos), resp, vueltas=0;
    while(true){
      resp=await llamarClaude(msgs); msgs=msgs.concat([{role:'assistant',content:resp.content}]);
      if(resp.stop_reason==='refusal'){ throw Object.assign(new Error('refusal'),{status:'refusal'}); }
      if(resp.stop_reason!=='tool_use' || ++vueltas>5) break;
      const results=[];
      for(const b of resp.content.filter(x=>x.type==='tool_use')){
        try{ const inp=b.input||{};
          if(b.name==='obtener_movimientos') results.push({type:'tool_result',tool_use_id:b.id,content:datosObra(inp.obra)});
          else if(b.name==='ver_fotos') results.push({type:'tool_result',tool_use_id:b.id,content:await fotosPara(inp.ids)});
          else results.push({type:'tool_result',tool_use_id:b.id,content:'Herramienta desconocida',is_error:true});
        }catch(e){ results.push({type:'tool_result',tool_use_id:b.id,content:'Error: '+e.message,is_error:true}); }
      }
      msgs=msgs.concat([{role:'user',content:results}]);
    }
    S.claudeMsgs=msgs;
    const txt=resp.content.filter(x=>x.type==='text').map(x=>x.text).join('\n\n').trim();
    S.chatC.push({bot:txt?textoClaude(txt):'No tuve una respuesta. Prueba a preguntar de otra forma.'});
  }catch(e){
    const m = e.status===401? 'Tu clave de Claude no es válida. Revísala en <b>Más → Claude</b>.'
      : e.status===429? 'Hice muchas consultas seguidas. Espera un minuto y vuelve a preguntar.'
      : e.status==='refusal'? 'Claude no pudo responder esa pregunta. Prueba con otras palabras.'
      : e.status? `Claude respondió con un error (${esc(String(e.status))}): ${esc(e.message)}`
      : 'No pude conectarme. Revisa tu internet o usa <b>Jarvis</b>.';
    S.chatC.push({bot:m});
  }
  S.pensando=false; if(S.view==='asistente'){ render(); setTimeout(()=>scrollTo(0,document.body.scrollHeight),30); }
}

   <div class="card" style="margin-bottom:14px;font-size:14px"><b>Cómo sacarla:</b> entra a <b>console.anthropic.com</b> desde el navegador, agrega saldo en Billing, ve a <b>API Keys</b>, toca <b>Create Key</b> y cópiala aquí.</div>

function loadImg(src){ return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;}); }
async function compress(blob,max=1600,q=.78){
  const url=URL.createObjectURL(blob); try{ const img=await loadImg(url); const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); const out=await new Promise(r=>c.toBlob(r,'image/jpeg',q)); return {blob:out||blob,w:c.width,h:c.height};
  } finally { URL.revokeObjectURL(url); } }
async function onFoto(file){ if(!file||!W) return; if(W.photoT==='comp') return onComp(file); toast('Procesando foto…'); try{ const r=await compress(file); if(W.fotoUrl) URL.revokeObjectURL(W.fotoUrl); W.foto=r.blob; W.fotoUrl=URL.createObjectURL(r.blob); W.fotoChanged=true; renderWz(); $('.toast').hidden=true; if(W.mode==='factura') autoLeer(); }catch(e){ toast('No se pudo leer esa imagen. Prueba con otra.'); } }

let PENDING=null;
async function shareFile(){ try{ await navigator.share({files:[PENDING.file],title:PENDING.nombre}); closeLayer(); }catch(e){ if(e.name!=='AbortError') toast('No se pudo compartir. Usa Guardar en Descargas.'); } }
function dlFile(){ const a=document.createElement('a'); a.href=URL.createObjectURL(PENDING.blob); a.download=PENDING.nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); toast('Guardado en Descargas'); }
const safeName = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/_+/g,'_');

/* ---------- Excel ---------- */
function loadExcelJS(){ if(window.ExcelJS) return Promise.resolve(); return new Promise((res,rej)=>{const s=document.createElement('script');s.src='exceljs.min.js';s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar el generador de Excel'));document.head.appendChild(s);}); }
async function exportar(scope){
  toast('Armando el Excel…');
  try{ await loadExcelJS(); }catch(e){ toast(e.message); return; }
  const obras = scope==='todas'? S.obras : [obra()];
  const wb=new ExcelJS.Workbook(); wb.creator='Caja Chica de Obra'; wb.created=new Date();
  const head={font:{bold:true,color:{argb:'FFFFFFFF'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF1A2632'}},alignment:{vertical:'middle',horizontal:'center',wrapText:true}};
  const thin={style:'thin',color:{argb:'FFD0D6DC'}}; const border={top:thin,left:thin,bottom:thin,right:thin};
  const usados=new Set();
  for(const o of obras){
    let nm=o.nombre.toUpperCase().replace(/[\[\]:*?\/\\]/g,'').slice(0,31)||'OBRA'; while(usados.has(nm)) nm=nm.slice(0,28)+'_'+usados.size; usados.add(nm);
    const ws=wb.addWorksheet(nm,{views:[{state:'frozen',ySplit:1}]});
    ws.columns=[{header:'FECHA',width:12},{header:'DETALLE',width:30},{header:'BENEFICIARIO',width:34},{header:'LUGAR O LOGO',width:20},{header:'FACTURA',width:20},{header:'# CHEQ O TRASFE',width:17},{header:'NUMERO',width:14},{header:'CREDITO',width:12},{header:'DEBITO',width:12},{header:'CATEGORIA',width:15},{header:'FOTO FACTURA',width:20},{header:'FOTO COMPROBANTE',width:20}];
    ws.getRow(1).height=30; ws.getRow(1).eachCell(c=>{Object.assign(c,{font:head.font,fill:head.fill,alignment:head.alignment,border});});
    const ms=movsObra(o.id).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.creado||0)-(b.creado||0));
    let r=2;
    for(const m of ms){
      const ing=m.tipo==='ingreso';
      const row=ws.getRow(r); row.values=[parseISO(m.fecha),m.detalle,m.beneficiario||'',m.lugar||'-',m.persona?'SIN FACTURA':(m.factura||(m.pendiente?'PENDIENTE':'-')),m.pago,m.numero||'-',ing?m.valor:null,ing?null:m.valor,ing?'':m.categoria,'',''];
      row.getCell(1).numFmt='dd/mm/yyyy'; row.getCell(8).numFmt='#,##0.00'; row.getCell(9).numFmt='#,##0.00';
      row.eachCell({includeEmpty:true},c=>{c.border=border;c.alignment={vertical:'middle',wrapText:c.col===2||c.col===3};});
      for(const [fid,col] of [[m.fotoId,10],[m.compId,11]]){ if(!fid) continue; const f=await DB.get('fotos',fid); if(f){ const sm=await compress(f.blob,1000,.72); const b64=await blobToDataURL(sm.blob);
        const imgId=wb.addImage({base64:b64,extension:'jpeg'}); let h=90, w=Math.round(90*sm.w/sm.h); if(w>140){ w=140; h=Math.round(140*sm.h/sm.w); }
        ws.addImage(imgId,{tl:{col:col+0.05,row:r-1+0.05},ext:{width:w,height:h},editAs:'oneCell'}); row.height=72; } }
      r++;
    }
    const last=r-1, t=totales(ms);
    const tr=ws.getRow(r+1); tr.getCell(7).value='TOTAL'; tr.getCell(8).value={formula:`SUM(H2:H${Math.max(2,last)})`,result:t.ing}; tr.getCell(9).value={formula:`SUM(I2:I${Math.max(2,last)})`,result:t.gas};
    const sr=ws.getRow(r+2); sr.getCell(7).value='SALDO'; sr.getCell(9).value={formula:`H${r+1}-I${r+1}`,result:t.saldo};
    [tr,sr].forEach(x=>{x.font={bold:true};x.getCell(8).numFmt='#,##0.00';x.getCell(9).numFmt='#,##0.00';});
    ws.autoFilter={from:'A1',to:`L${Math.max(1,last)}`};
  }
  const wc=wb.addWorksheet('CATEGORIAS'); wc.columns=[{width:22},{width:16},{width:14},{width:10}];
  let r=1;
  for(const o of obras){
    const gs=movsObra(o.id).filter(m=>m.tipo==='gasto'), tot=gs.reduce((a,m)=>a+m.valor,0);
    wc.getRow(r).values=[o.nombre.toUpperCase()]; wc.getRow(r).font={bold:true,size:13}; r++;
    const h=wc.getRow(r); h.values=['CATEGORIA','TOTAL','%','GASTOS']; h.eachCell(c=>{Object.assign(c,{font:head.font,fill:head.fill,alignment:head.alignment,border});}); r++;
    for(const c of CATS.filter(c=>!c.oculta||gs.some(m=>m.categoria===c.id))){ const v=r2(gs.filter(m=>m.categoria===c.id).reduce((a,m)=>a+m.valor,0)), n=gs.filter(m=>m.categoria===c.id).length;
      const row=wc.getRow(r); row.values=[c.id,v,tot?v/tot:0,n]; row.getCell(2).numFmt='#,##0.00'; row.getCell(3).numFmt='0.0%'; row.eachCell(x=>x.border=border); r++; }
    const tr=wc.getRow(r); tr.values=['TOTAL',r2(tot),tot?1:0,gs.length]; tr.font={bold:true}; tr.getCell(2).numFmt='#,##0.00'; tr.getCell(3).numFmt='0.0%'; r+=3;
  }
  const pagos=obras.flatMap(o=>movsObra(o.id).filter(m=>m.persona).map(m=>({...m,obra:o.nombre})));
  if(pagos.length){ const wp=wb.addWorksheet('PERSONAS'); wp.columns=[{header:'OBRA',width:18},{header:'PERSONA',width:30},{header:'FECHA',width:12},{header:'MOTIVO',width:26},{header:'FORMA',width:16},{header:'VALOR',width:12}];
    wp.getRow(1).eachCell(c=>{Object.assign(c,{font:head.font,fill:head.fill,alignment:head.alignment,border});});
    pagos.sort((a,b)=>(a.obra+a.beneficiario+a.fecha).localeCompare(b.obra+b.beneficiario+b.fecha)).forEach(m=>{ const row=wp.addRow([m.obra.toUpperCase(),m.beneficiario,parseISO(m.fecha),m.detalle,m.pago,m.valor]); row.getCell(3).numFmt='dd/mm/yyyy'; row.getCell(6).numFmt='#,##0.00'; row.eachCell(c=>c.border=border); });
    const tr=wp.addRow(['','','','','TOTAL',r2(pagos.reduce((a,m)=>a+m.valor,0))]); tr.font={bold:true}; tr.getCell(6).numFmt='#,##0.00'; }
  const buf=await wb.xlsx.writeBuffer();
  const nombre=`CajaChica_${scope==='todas'?'Todas':safeName(obra().nombre)}_${todayISO()}.xlsx`;
  entregar(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),nombre);
}

/* ---------- respaldo ---------- */
async function backup(){
  toast('Preparando respaldo…');
  const fotos=await DB.all('fotos'); const fs=[]; for(const f of fotos) fs.push({id:f.id,data:await blobToDataURL(f.blob)});
  const json=JSON.stringify({app:'caja-chica-obra',version:1,exportado:new Date().toISOString(),obras:S.obras,movs:S.movs,cats:CATS,fotos:fs});
  entregar(new Blob([json],{type:'application/json'}),`Respaldo_CajaChica_${todayISO()}.json`);
}
async function restore(file){
  try{ const j=JSON.parse(await file.text()); if(j.app!=='caja-chica-obra') throw new Error();
    await DB.putMany('obras',j.obras||[]); await DB.putMany('movs',j.movs||[]); if(j.cats&&j.cats.length) await DB.putMany('cats',j.cats);
    for(const f of j.fotos||[]){ const b=await (await fetch(f.data)).blob(); await DB.put('fotos',{id:f.id,blob:b}); }
    await loadAll(); S.view='inicio'; render(); toast(`Respaldo cargado: ${(j.movs||[]).length} movimientos`);
  }catch(e){ toast('Ese archivo no es un respaldo de esta app.'); }
}

/* ---------- eventos ---------- */
const armed=new Set();
function arm(btn,key,label){ if(armed.has(key)) return true; armed.add(key); btn.classList.add('armed'); btn.textContent=label; setTimeout(()=>{armed.delete(key);btn.isConnected&&btn.classList.remove('armed');},4000); return false; }
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='bg-close'){ if(e.target===b) { if(W) return; closeLayer(); } return; }
  switch(a){
    case 'view': S.view=b.dataset.v; S.cat=null; render(); scrollTo(0,0); if(S.view==='mas') showStorage(); if(S.view==='asistente'){ cargarThumbs(); setTimeout(()=>scrollTo(0,document.body.scrollHeight),30); } break;
    case 'nuevo-gasto': elegirTipo(); break;
    case 'nuevo-factura': nuevoGasto('factura'); break;
    case 'voz': abrirVoz(); break;
    case 'fondo': abrirFondo(); break;
    case 'fondo-set': store.set('bal',{...store.get('bal',{}),tipo:b.dataset.t}); closeLayer(); render(); toast('Fondo cambiado'); break;
    case 'fondo-img': $('#f-balimg').click(); break;
    case 'voz-start': vozStart(); break;
    case 'voz-stop': vozStop(); break;
    case 'voz-reparse': VR.texto=$('#voz-t').value; VR.drafts=parseVoz(VR.texto); renderVoz(); break;
    case 'voz-add': VR.drafts.push({detalle:'',valor:'',categoria:'',pago:'EFECTIVO'}); renderVoz(); break;
    case 'voz-del': VR.drafts.splice(+b.dataset.i,1); renderVoz(); break;
    case 'voz-save': b.disabled=true; await vozGuardar(); break;
    case 'voz-close': vozCerrar(); break;
    case 'nuevo-persona': nuevoGasto('persona'); break;
    case 'w-persona': W.d.beneficiario=b.dataset.v; renderWz(); break;
    case 'w-motivo': { const mo=MOTIVOS.find(x=>x[0]===b.dataset.v); W.d.detalle=mo[0]; if(mo[1] && CAT[mo[1]] && (!W.d.categoria||MOTIVOS.some(x=>x[1]===W.d.categoria))) W.d.categoria=mo[1]; renderWz(); if(mo[0]==='OTRO') setTimeout(()=>$('#w-detalle')?.focus(),60); break; }
    case 'releer': autoLeer(true); break;
    case 'cats': catsSheet(); break;
    case 'cat-new': formCat(null); break;
    case 'cat-edit': formCat(CAT[b.dataset.id]); break;
    case 'cat-cancel': if(W) renderWz(); else catsSheet(); break;
    case 'cf-emoji': CF.emoji=b.dataset.e; CF.img=null; refreshCF(); document.querySelectorAll('.emo-grid button').forEach(x=>x.classList.toggle('on',x===b)); break;
    case 'cf-color': CF.c=b.dataset.c; refreshCF(); document.querySelectorAll('.swatches button').forEach(x=>x.classList.toggle('on',x===b)); break;
    case 'cf-img': $('#f-catimg').click(); break;
    case 'cf-clear': CF.emoji=''; CF.img=null; refreshCF(); break;
    case 'cf-save': saveCat(); break;
    case 'cf-del': { const used=S.movs.filter(m=>m.categoria===CF.id).length; if(!arm(b,'cf',used?'Toca otra vez para ocultarla':'Toca otra vez para eliminarla')) return;
      if(used) await DB.put('cats',{...CAT[CF.id],oculta:true}); else await DB.del('cats',CF.id); await loadCats(); toast(used?'Categoría oculta':'Categoría eliminada'); if(W) renderWz(); else catsSheet(); render(); break; }
    case 'cf-show': await DB.put('cats',{...CAT[CF.id],oculta:false}); await loadCats(); toast('Categoría visible otra vez'); catsSheet(); render(); break;
    case 'persona-list': { const n=b.dataset.n; const ms=sortMovs(movsObra().filter(enPeriodo).filter(m=>m.persona&&(m.beneficiario||'SIN NOMBRE')===n)); const tot=ms.reduce((a,m)=>a+m.valor,0);
      openLayer(`${sheetHead(esc(n))}<p class="hint" style="margin-top:-4px">${ms.length} ${ms.length===1?'pago':'pagos'} · total <b class="num" style="color:var(--ink)">${money(tot)}</b></p><div class="list">${ms.map(rowHTML).join('')}</div>`); break; }
    case 'nuevo-ingreso': formIngreso(); break;
    case 'close': closeLayer(); break;
    case 'wz-close': if(W && (W.fotoUrl||W.d.valor||W.d.detalle) && W.isNew){ if(!arm(b,'wz','?')) { b.innerHTML='<b style="font-size:11px;color:var(--bad)">¿Salir?</b>'; return; } } closeLayer(); break;
    case 'cam': if(W) W.photoT=b.dataset.t||'fact'; $('#f-cam').click(); break;
    case 'gal': if(W) W.photoT=b.dataset.t||'fact'; $('#f-gal').click(); break;
    case 'quitar-comp': if(W.compUrl) URL.revokeObjectURL(W.compUrl); W.comp=null; W.compUrl=null; W.compChanged=true; W.ocrC=null; renderWz(); break;
    case 'ask': if(S.modo==='claude') preguntarClaude(b.dataset.q); else preguntar(b.dataset.q); break;
    case 'chat-clear': if(S.modo==='claude'){ S.chatC=[]; S.claudeMsgs=[]; } else S.chat=[]; render(); break;
    case 'modo': S.modo=b.dataset.m; store.set('modo',S.modo); render(); setTimeout(()=>scrollTo(0,document.body.scrollHeight),30); break;
    case 'claude-key': abrirClave(); break;
    case 'key-del': store.set('claudeKey',''); closeLayer(); render(); toast('Clave borrada'); break;
    case 'quitar-foto': if(W.fotoUrl) URL.revokeObjectURL(W.fotoUrl); W.foto=null; W.fotoUrl=null; W.fotoChanged=true; renderWz(); break;
    case 'w-cat': W.d.categoria=b.dataset.c; document.querySelectorAll('.cat-opt').forEach(x=>x.classList.toggle('on',x===b)); break;
    case 'w-fecha': W.d.fecha=todayISO(+b.dataset.v); renderWz(); break;
    case 'w-pago': W.d.pago=b.dataset.p; renderWz(); break;
    case 'w-next': { const err=wzValid(); if(err){ $('#w-err').textContent=err; return; } W.step++; renderWz(); break; }
    case 'w-back': W.step--; renderWz(); break;
    case 'w-go': W.step=+b.dataset.s; renderWz(); break;
    case 'w-save': b.disabled=true; await wzSave(); break;
    case 'ver': verMov(b.dataset.id); break;
    case 'zoom': { const v=document.createElement('div'); v.className='viewer'; v.innerHTML=`<img src="${b.dataset.src}" alt="Factura"><button class="x" aria-label="Cerrar">${svg(UI.x)}</button>`;
      v.addEventListener('click',ev=>{ if(ev.target.closest('.x')) v.remove(); else v.classList.toggle('zoom'); }); document.body.appendChild(v); break; }
    case 'editar': { const m=S.movs.find(x=>x.id===b.dataset.id); closeLayer(); if(m.tipo==='ingreso') formIngreso(m); else { await editarGasto(m); if(b.dataset.s){ W.step=+b.dataset.s; renderWz(); } } break; }
    case 'borrar': { if(!arm(b,'del'+b.dataset.id,'Toca otra vez para eliminar')) return; const m=S.movs.find(x=>x.id===b.dataset.id); if(m.fotoId) await DB.del('fotos',m.fotoId); if(m.compId) await DB.del('fotos',m.compId); if(m.audioId && !S.movs.some(x=>x.id!==m.id&&x.audioId===m.audioId)) await DB.del('fotos',m.audioId); await DB.del('movs',m.id); await loadAll(); closeLayer(); render(); toast('Movimiento eliminado'); break; }
    case 'filtro-cat': S.cat = b.dataset.c && S.cat!==b.dataset.c ? b.dataset.c : null; render(); break;
    case 'periodo': S.periodo=b.dataset.p; render(); break;
    case 'revisar': { const k=b.dataset.k; const ms=sortMovs(movsObra().filter(enPeriodo).filter(m=>m.tipo==='gasto'&&(k==='foto'?!m.fotoId:!m.factura)));
      openLayer(`${sheetHead(k==='foto'?'Gastos sin foto':'Gastos sin factura')}<div class="list">${ms.map(rowHTML).join('')||'<div class="empty">Nada pendiente.</div>'}</div>`); break; }
    case 'pick-obra': pickObra(); break;
    case 'set-obra': S.obraId=b.dataset.id; store.set('obra',S.obraId); S.cat=null; closeLayer(); render(); break;
    case 'nueva-obra': formObra(); break;
    case 'editar-obra': formObra(obra()); break;
    case 'borrar-obra': { if(!arm(b,'obra','Toca otra vez para eliminar todo')) return; const id=b.dataset.id; for(const m of movsObra(id)){ if(m.fotoId) await DB.del('fotos',m.fotoId); if(m.compId) await DB.del('fotos',m.compId); await DB.del('movs',m.id); } await DB.del('obras',id); await loadAll(); closeLayer(); S.view='inicio'; render(); toast('Obra eliminada'); break; }
    case 'seed': b.disabled=true; await seed(); break;
    case 'export': exportar(b.dataset.scope); break;
    case 'backup': backup(); break;
    case 'restore': $('#f-restore').click(); break;
    case 'share-file': shareFile(); break;
    case 'dl-file': dlFile(); break;
    case 'install': if(S.installEvt){ S.installEvt.prompt(); const r=await S.installEvt.userChoice; S.installEvt=null; render(); if(r.outcome==='accepted') toast('¡Listo! Ya la tienes en tu pantalla de inicio'); } break;
    case 'install-help': openLayer(`${sheetHead('Instalar en el celular')}<div class="card"><p style="margin-top:0"><b>Android (Chrome):</b> toca el menú ⋮ arriba a la derecha y elige <b>Instalar aplicación</b> o <b>Agregar a pantalla principal</b>.</p><p style="margin-bottom:0"><b>iPhone (Safari):</b> toca Compartir y elige <b>Agregar a inicio</b>.</p></div><p class="note">Ábrela una vez con internet. Después funciona sin señal.</p>`); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ S.q=t.value; const ms=movsObra(); const lista=sortMovs(filtrar(ms)); const grupos=[]; let g=null; for(const m of lista){ if(!g||g.f!==m.fecha){g={f:m.fecha,items:[],tot:0};grupos.push(g);} g.items.push(m); if(m.tipo==='gasto') g.tot+=m.valor; } $('#lista').innerHTML=listaHTML(grupos); return; }
  if(W && t.dataset.f){
    if(t.dataset.f==='factura'){ const f=fmtFactura(t.value); if(f!==t.value){ t.value=f; } }
    W.d[t.dataset.f]=t.value; $('#w-err')&&($('#w-err').textContent=''); W.touched=W.touched||new Set(); W.touched.add(t.dataset.f); if(W.auto.delete(t.dataset.f)) t.classList.remove('auto'), t.closest('.money')?.classList.remove('auto');
    if(t.dataset.f==='beneficiario' && !W.d.lugar){ const p=S.movs.find(m=>m.beneficiario===t.value.toUpperCase()&&m.lugar); if(p){ W.d.lugar=p.lugar; const l=$('#w-lugar'); if(l) l.value=p.lugar; } }
  }
});
document.addEventListener('input',e=>{ const t=e.target; if(!VR) return; if(t.id==='voz-t') VR.texto=t.value; if(t.dataset.vd!=null){ VR.drafts[+t.dataset.i][t.dataset.vd]=t.value; } });
document.addEventListener('change',e=>{ const t=e.target; if(VR && t.dataset.vd!=null) VR.drafts[+t.dataset.i][t.dataset.vd]=t.value; });
document.addEventListener('change',e=>{ if(W && e.target.id==='w-fecha'){ W.d.fecha=e.target.value; W.auto.delete('fecha'); } });
document.addEventListener('input',e=>{ if(e.target.dataset.cf){ CF[e.target.dataset.cf]=e.target.value; if(e.target.dataset.cf==='emoji'){ CF.img=null; } refreshCF(); } });
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='f-ask'){ const i=$('#ask-q'); const v=i.value.trim(); if(!v) return; if(S.modo==='claude'){ if(!S.pensando) preguntarClaude(v); } else preguntar(v); return; }
  if(e.target.id==='f-key'){ const k=String(new FormData(e.target).get('k')||'').trim(); store.set('claudeKey',k); closeLayer(); render(); toast(k?'Clave guardada':'Clave borrada'); return; } if(e.target.id==='f-ing') saveIngreso(e.target); if(e.target.id==='f-obra') saveObra(e.target); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && W && e.target.matches('.wz-body input') && steps()[W.step]!=='revisar'){ e.preventDefault(); $('[data-act="w-next"]')?.click(); } });
$('#f-cam').addEventListener('change',e=>{ onFoto(e.target.files[0]); e.target.value=''; });
$('#f-gal').addEventListener('change',e=>{ onFoto(e.target.files[0]); e.target.value=''; });
$('#f-catimg').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f||!CF) return; try{ CF.img=await miniImagen(f); CF.emoji=''; refreshCF(); }catch(err){ toast('No se pudo usar esa imagen.'); } });
$('#f-balimg').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const r=await compress(f,1000,.72); const d=await blobToDataURL(r.blob); store.set('bal',{tipo:'img',img:d}); if(store.get('bal',{}).img!==d){ toast('La imagen es muy pesada. Prueba con otra.'); return; } closeLayer(); render(); toast('Fondo cambiado'); }catch(err){ toast('No se pudo usar esa imagen.'); } });
$('#f-restore').addEventListener('change',e=>{ if(e.target.files[0]) restore(e.target.files[0]); e.target.value=''; });
addEventListener('online',()=>render()); addEventListener('offline',()=>render());
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; if(!$('.sheet')) render(); });

/* ---------- inicio ---------- */
(async function(){
  await DB.open(); S.obraId=store.get('obra',null); S.modo=store.get('modo','jarvis'); await loadAll(); render();
  try{ S.persisted = await navigator.storage?.persisted?.() || false; }catch(e){}
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();
